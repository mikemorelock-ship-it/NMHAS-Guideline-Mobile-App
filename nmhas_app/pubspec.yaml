name: nmhas_app
description: "NMHAS Guideline Platform — EMS protocol reference and learning app"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Local Database (structured data)
  drift: ^2.24.0
  sqlite3_flutter_libs: ^0.5.28

  # Local Cache (key-value)
  hive_flutter: ^1.1.0

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_messaging: ^15.2.4

  # PDF Rendering
  syncfusion_flutter_pdfviewer: ^28.2.12

  # Authentication
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4

  # Networking
  dio: ^5.7.0

  # Utilities
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.24.0
  build_runner: ^2.4.14

flutter:
  uses-material-design: true

  assets:
    - assets/images/
